name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK on GitHub Hosted Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APKs for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk jellyfin-webview-debug.apk
          cp app/build/outputs/apk/release/app-release.apk jellyfin-webview-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-webview-debug-apk
          path: jellyfin-webview-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-webview-release-apk
          path: jellyfin-webview-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            jellyfin-webview-release.apk
            jellyfin-webview-debug.apk
          generate_release_notes: true
